<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SecureChat — #{{ room_id }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080d14;--panel:#0f1a27;--card:#172438;--card2:#1e2f45;
  --border:#1e3350;--border2:#2a4a70;
  --cyan:#00e5ff;--green:#39ff85;--red:#ff3355;--amber:#ffb700;
  --t1:#daeeff;--t2:#6b90b8;--t3:#2a4460;
  --mono:'DM Mono',monospace;--sans:'Syne',sans-serif;
  --topbar:56px;--inputbar:68px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:-webkit-fill-available;overflow:hidden;position:fixed;width:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans)}
button,input{font-family:inherit;border:none;outline:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;
  height:var(--topbar);z-index:200;
  background:rgba(8,13,20,.95);border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;padding:0 .75rem;gap:.5rem;
}
.ham{
  width:40px;height:40px;background:none;border:none;
  color:var(--t2);cursor:pointer;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:background .2s;flex-shrink:0;
}
.ham:active{background:var(--card)}
.ham span{display:block;width:18px;height:2px;background:currentColor;border-radius:2px;transition:all .28s cubic-bezier(.4,0,.2,1)}
.ham.x span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.ham.x span:nth-child(2){opacity:0;transform:scaleX(0)}
.ham.x span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.tb-center{flex:1;min-width:0;padding:0 .3rem}
.tb-room{font-weight:800;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-family:var(--mono);font-size:.58rem;color:var(--t2);margin-top:1px}
.tb-right{display:flex;align-items:center;gap:.4rem;flex-shrink:0}
.conn-pill{
  font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;
  padding:.22rem .55rem;border-radius:20px;border:1px solid;white-space:nowrap;
}
.conn-pill.on{color:var(--green);border-color:rgba(57,255,133,.35);background:rgba(57,255,133,.08)}
.conn-pill.off{color:var(--red);border-color:rgba(255,51,85,.3);background:rgba(255,51,85,.07)}
.tb-btn{
  width:36px;height:36px;background:none;border:1px solid var(--border);
  color:var(--t2);border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:.95rem;
  transition:all .2s;flex-shrink:0;
}
.tb-btn:active{background:var(--card)}

/* ── DRAWER OVERLAY ── */
.ov{
  position:fixed;inset:0;z-index:290;
  background:rgba(0,0,0,.65);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.ov.show{opacity:1;pointer-events:all}

/* ── DRAWER ── */
.drawer{
  position:fixed;top:0;left:0;bottom:0;width:75vw;max-width:300px;
  z-index:300;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  transform:translateX(-100%);
  transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.drawer.open{transform:translateX(0)}
.dr-head{
  height:var(--topbar);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 1rem;
  font-family:var(--sans);font-weight:800;font-size:.9rem;
}
.dr-head em{color:var(--cyan);font-style:normal}
.dr-sec{padding:.9rem 1rem;border-bottom:1px solid var(--border)}
.dr-title{
  font-family:var(--mono);font-size:.6rem;color:var(--t2);letter-spacing:.22em;margin-bottom:.75rem;
  display:flex;align-items:center;justify-content:space-between;
}
.cnt{background:var(--cyan);color:#000;font-size:.58rem;font-weight:700;padding:1px 7px;border-radius:10px}
.room-btn{
  display:flex;align-items:center;gap:.5rem;width:100%;
  padding:.6rem .75rem;border-radius:9px;background:none;
  color:var(--t2);cursor:pointer;transition:all .15s;
  font-size:.9rem;font-family:var(--sans);
}
.room-btn:active,.room-btn:hover{background:var(--card);color:var(--t1)}
.room-btn.cur{
  background:rgba(0,229,255,.1);color:var(--cyan);
  border-left:2px solid var(--cyan);padding-left:.6rem;
}
.r-hash{color:var(--t3);font-family:var(--mono)}
.u-row{display:flex;align-items:center;gap:.55rem;padding:.32rem .2rem;font-size:.85rem;color:var(--t2)}
.u-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 5px var(--green)}
.dr-foot{
  padding:.9rem 1rem;border-top:1px solid var(--border);margin-top:auto;
  display:flex;flex-direction:column;gap:.5rem;
}
.dr-user{font-family:var(--mono);font-size:.7rem;color:var(--cyan);overflow:hidden;text-overflow:ellipsis}
.dr-btn{
  width:100%;padding:.58rem;background:none;border:1px solid var(--border);
  color:var(--t2);border-radius:9px;cursor:pointer;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;transition:all .2s;
}
.dr-btn:active{background:var(--card)}
.dr-btn.danger:active,.dr-btn.danger:hover{border-color:var(--red);color:var(--red)}

/* ── MESSAGES ── */
.msgs{
  position:fixed;top:var(--topbar);bottom:var(--inputbar);left:0;right:0;
  overflow-y:auto;overflow-x:hidden;
  padding:.9rem .75rem .5rem;
  display:flex;flex-direction:column;gap:.4rem;
  -webkit-overflow-scrolling:touch;
}
.msg{display:flex;flex-direction:column;max-width:83%;animation:pop .22s cubic-bezier(.34,1.4,.64,1)}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(8px)}to{opacity:1;transform:none}}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.them{align-self:flex-start;align-items:flex-start}
.msg-meta{
  display:flex;align-items:center;gap:.4rem;
  font-family:var(--mono);font-size:.6rem;color:var(--t3);
  margin-bottom:.22rem;padding:0 .3rem;
}
.msg.me .msg-meta{flex-direction:row-reverse}
.msg-user{font-weight:500;color:var(--cyan)}
.msg.me .msg-user{color:var(--green)}
.bubble{
  padding:.6rem .9rem;line-height:1.55;font-size:.95rem;word-break:break-word;
}
.msg.them .bubble{
  background:var(--card);border:1px solid var(--border);
  border-radius:14px 14px 14px 4px;color:var(--t1);
}
.msg.me .bubble{
  background:rgba(0,229,255,.11);border:1px solid rgba(0,229,255,.2);
  border-radius:14px 14px 4px 14px;color:var(--t1);
}
.msg.sys{
  align-self:center;max-width:88%;text-align:center;
  font-family:var(--mono);font-size:.63rem;color:var(--t3);
  padding:.28rem .8rem;background:rgba(255,255,255,.025);
  border-radius:20px;border:1px solid var(--border);margin:.2rem 0;
}

/* ── INPUT BAR ── */
.input-bar{
  position:fixed;bottom:0;left:0;right:0;
  height:var(--inputbar);
  padding:.65rem .75rem calc(.65rem + var(--safe-bot));
  background:rgba(8,13,20,.96);border-top:1px solid var(--border);
  backdrop-filter:blur(20px);z-index:200;
  display:flex;align-items:center;gap:.5rem;
}
.msg-input{
  flex:1;background:var(--card);border:1.5px solid var(--border);
  color:var(--t1);padding:.7rem 1.1rem;
  border-radius:24px;font-size:16px; /* prevent iOS zoom */
  transition:border-color .2s;
}
.msg-input:focus{border-color:var(--cyan)}
.msg-input::placeholder{color:var(--t3)}
.send-btn{
  width:46px;height:46px;flex-shrink:0;
  background:var(--cyan);color:#000;border-radius:50%;
  font-size:1.15rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 18px rgba(0,229,255,.3);transition:all .2s;
}
.send-btn:active{transform:scale(.9)}

/* ── TOASTS ── */
.toasts{
  position:fixed;top:calc(var(--topbar) + .55rem);right:.7rem;
  z-index:600;display:flex;flex-direction:column;gap:.4rem;
  pointer-events:none;max-width:min(320px,calc(100vw - 1.4rem));
}
.toast{
  background:var(--panel);border-radius:11px;border:1px solid;
  padding:.55rem .85rem;font-family:var(--mono);font-size:.7rem;line-height:1.5;
  pointer-events:all;box-shadow:0 8px 28px rgba(0,0,0,.5);
  animation:tin .28s ease;
}
@keyframes tin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.toast.high,.toast.critical{border-color:rgba(255,51,85,.45);background:rgba(255,51,85,.12)}
.toast.medium{border-color:rgba(255,183,0,.45);background:rgba(255,183,0,.1)}
.t-hd{display:flex;justify-content:space-between;margin-bottom:.15rem}
.t-type{font-weight:500;color:var(--red)}
.toast.medium .t-type{color:var(--amber)}
.t-time{font-size:.6rem;color:var(--t3)}
.t-msg{color:var(--t1)}

/* ── QR BOTTOM SHEET ── */
.sheet-wrap{
  position:fixed;inset:0;z-index:500;
  background:rgba(0,0,0,.75);backdrop-filter:blur(8px);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .28s;
}
.sheet-wrap.show{opacity:1;pointer-events:all}
.sheet{
  background:var(--panel);border:1px solid var(--border2);
  border-radius:20px 20px 0 0;width:100%;max-width:500px;
  padding:1.2rem 1.2rem calc(1.4rem + var(--safe-bot));
  position:relative;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);
}
.sheet-wrap.show .sheet{transform:translateY(0)}
.sh-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 1.1rem}
.sh-title{font-family:var(--mono);font-size:.82rem;color:var(--cyan);letter-spacing:.14em;margin-bottom:.4rem}
.sh-desc{font-size:.85rem;color:var(--t2);line-height:1.65;margin-bottom:1.2rem}
.sh-close{
  position:absolute;top:1.2rem;right:1.2rem;
  width:32px;height:32px;background:var(--card);border:none;
  border-radius:50%;color:var(--t2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
}
.gen-btn{
  width:100%;padding:.85rem;background:var(--cyan);color:#000;
  border-radius:13px;font-family:var(--sans);font-weight:700;
  font-size:.9rem;letter-spacing:.07em;cursor:pointer;
}
.gen-btn:active{opacity:.85}
.qr-out{text-align:center;margin-top:1rem}
.qr-out img{max-width:190px;border:2px solid var(--cyan);border-radius:12px}
.qr-meta{font-family:var(--mono);font-size:.63rem;color:var(--t2);margin-top:.55rem}
.qr-link{
  display:block;margin-top:.45rem;font-family:var(--mono);font-size:.63rem;
  color:var(--cyan);word-break:break-all;background:var(--card);
  padding:.5rem .7rem;border-radius:8px;
}

/* ── DESKTOP: reveal sidebar as permanent + right panel ── */
@media(min-width:680px){
  .ham,.ov{display:none}
  .drawer{
    transform:none!important;
    padding-top:0;
    border-top:none;
  }
  .topbar,.msgs,.input-bar,.toasts{left:min(75vw,300px)}
}
@media(min-width:960px){
  .right-bar{display:flex!important}
  .topbar,.msgs,.input-bar,.toasts{right:230px}
}

/* ── RIGHT BAR (desktop) ── */
.right-bar{
  display:none;
  position:fixed;top:var(--topbar);right:0;bottom:0;width:230px;
  background:var(--panel);border-left:1px solid var(--border);
  flex-direction:column;overflow:hidden;z-index:50;
}
.rb-sec{padding:.8rem 1rem;border-bottom:1px solid var(--border)}
.rb-title{font-family:var(--mono);font-size:.58rem;color:var(--t2);letter-spacing:.2em;margin-bottom:.6rem}
.s-stat{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.68rem;padding:.28rem 0;border-bottom:1px solid var(--border)}
.s-stat span:first-child{color:var(--t2)}
.rb-alerts{flex:1;overflow-y:auto;padding:.75rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.a-item{
  font-family:var(--mono);font-size:.63rem;padding:.38rem .5rem;
  border-left:2px solid;border-radius:0 6px 6px 0;line-height:1.5;
}
.a-item.high,.a-item.critical{border-color:var(--red);background:rgba(255,51,85,.08)}
.a-item.medium{border-color:var(--amber);background:rgba(255,183,0,.07)}
.at{color:var(--t3);font-size:.58rem}
</style>
</head>
<body>

<header class="topbar">
  <button class="ham" id="ham" onclick="toggleDrawer()">
    <span></span><span></span><span></span>
  </button>
  <div class="tb-center">
    <div class="tb-room"># {{ room_id }}</div>
    <div class="tb-sub">IDS Protected · E2E Encrypted</div>
  </div>
  <div class="tb-right">
    <span class="conn-pill off" id="pill">● OFF</span>
    <button class="tb-btn" onclick="openQR()" title="Share QR">📱</button>
    <button class="tb-btn" onclick="location.href='/dashboard'" title="Dashboard">⊞</button>
  </div>
</header>

<div class="ov" id="ov" onclick="closeDrawer()"></div>

<nav class="drawer" id="drawer">
  <div class="dr-head">Secure<em>Chat</em></div>

  <div class="dr-sec">
    <div class="dr-title">ROOMS</div>
    <button onclick="goRoom('general')" class="room-btn {% if room_id=='general' %}cur{% endif %}">
      <span class="r-hash">#</span>general
    </button>
    <button onclick="goRoom('dev')" class="room-btn {% if room_id=='dev' %}cur{% endif %}">
      <span class="r-hash">#</span>dev
    </button>
    <button onclick="goRoom('security')" class="room-btn {% if room_id=='security' %}cur{% endif %}">
      <span class="r-hash">#</span>security
    </button>
  </div>

  <div class="dr-sec" style="flex:1;overflow-y:auto">
    <div class="dr-title">ONLINE <span class="cnt" id="ucnt">0</span></div>
    <div id="ulist"></div>
  </div>

  <div class="dr-foot">
    <div class="dr-user" id="dr-name">—</div>
    <button class="dr-btn" onclick="location.href='/dashboard'">⊞ Dashboard</button>
    <button class="dr-btn danger" onclick="logout()">⏻ Logout</button>
  </div>
</nav>

<div class="msgs" id="msgs"></div>

<div class="input-bar">
  <input class="msg-input" id="mi"
    placeholder="Message…" maxlength="1000"
    autocomplete="off" autocorrect="off" autocapitalize="sentences"
    enterkeyhint="send"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}">
  <button class="send-btn" onclick="send()">➤</button>
</div>

<aside class="right-bar" id="rbar">
  <div class="rb-sec">
    <div class="rb-title">SESSION</div>
    <div class="s-stat"><span>Room</span><span id="rb-room">—</span></div>
    <div class="s-stat"><span>Messages</span><span id="rb-msgs">0</span></div>
    <div class="s-stat"><span>Level</span><span id="rb-lvl" style="color:var(--green)">Normal</span></div>
  </div>
  <div class="rb-title" style="padding:.75rem 1rem .35rem">ALERTS</div>
  <div class="rb-alerts" id="rbalerts">
    <div class="at">No alerts yet</div>
  </div>
</aside>

<div class="toasts" id="toasts"></div>

<div class="sheet-wrap" id="qr-wrap" onclick="if(event.target===this)closeQR()">
  <div class="sheet">
    <div class="sh-handle"></div>
    <button class="sh-close" onclick="closeQR()">✕</button>
    <div class="sh-title">// QR ROOM JOIN</div>
    <p class="sh-desc">
      Share this code. Anyone who scans it gets a <strong>single-use, 5-minute,
      device-bound</strong> link to join <strong>#{{ room_id }}</strong>.
      Works from any phone camera.
    </p>
    <button class="gen-btn" onclick="genQR()">🔲 Generate QR Code</button>
    <div class="qr-out" id="qr-out"></div>
  </div>
</div>

<script>
const ROOM = "{{ room_id }}";
const ST   = sessionStorage.getItem("st");
const UN   = sessionStorage.getItem("un") || "anon";
const PT   = sessionStorage.getItem("pt") || "";
const FP   = {ua:navigator.userAgent,sc:`${screen.width}x${screen.height}`,
               tz:Intl.DateTimeFormat().resolvedOptions().timeZone};

if (!ST) { location.href = "/"; throw 0; }

document.getElementById("dr-name").textContent  = UN;
document.getElementById("rb-room").textContent  = "#"+ROOM;

// ── drawer ─────────────────────────────────────────────────────────────────
function toggleDrawer(){
  const open = document.getElementById("drawer").classList.toggle("open");
  document.getElementById("ov").classList.toggle("show", open);
  document.getElementById("ham").classList.toggle("x", open);
}
function closeDrawer(){
  document.getElementById("drawer").classList.remove("open");
  document.getElementById("ov").classList.remove("show");
  document.getElementById("ham").classList.remove("x");
}
function goRoom(r){ closeDrawer(); location.href=`/chat/${r}`; }

// ── websocket ──────────────────────────────────────────────────────────────
let ws, msgs=0, delay=1000;

function connect(){
  const proto = location.protocol==="https:"?"wss":"ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/chat/${ROOM}`);
  ws.onopen = () => {
    setPill(true); delay=1000;
    ws.send(JSON.stringify({type:"auth",session_token:ST,fingerprint:btoa(JSON.stringify(FP))}));
    if(PT) ws.send(JSON.stringify({type:"probe_echo",probe_token:PT}));
  };
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose   = () => { setPill(false); setTimeout(connect,delay); delay=Math.min(delay*2,12000); };
  ws.onerror   = () => setPill(false);
}

function setPill(on){
  const p = document.getElementById("pill");
  p.textContent = on?"● SECURE":"● OFFLINE";
  p.className   = "conn-pill "+(on?"on":"off");
}

// ── messages ────────────────────────────────────────────────────────────────
function handle(m){
  if(m.type==="chat"){
    addMsg(m.username,m.content,m.ts,m.username===UN);
    msgs++; document.getElementById("rb-msgs").textContent=msgs;
  }
  else if(m.type==="system"){ addSys(m.msg); updateUsers(m.users||[]); }
  else if(m.type==="error") { toast(m.msg,"high"); addRBAlert(m.msg,"high"); }
  else if(m.type==="kicked"){ toast("Kicked: "+m.reason,"critical"); ws.close(); setTimeout(()=>location.href="/",2500); }
}

function addMsg(user,content,ts,me){
  const area = document.getElementById("msgs");
  const d = document.createElement("div");
  d.className = "msg "+(me?"me":"them");
  const t = ts ? new Date(ts*1000).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}) : "";
  d.innerHTML = `<div class="msg-meta"><span class="msg-user">${esc(user)}</span><span>${t}</span></div>
                 <div class="bubble">${esc(content)}</div>`;
  area.appendChild(d);
  area.scrollTop = area.scrollHeight;
}
function addSys(t){
  const d=document.createElement("div"); d.className="msg sys"; d.textContent=t;
  const a=document.getElementById("msgs"); a.appendChild(d); a.scrollTop=a.scrollHeight;
}
function updateUsers(us){
  document.getElementById("ucnt").textContent=us.length;
  document.getElementById("ulist").innerHTML=
    us.map(u=>`<div class="u-row"><span class="u-dot"></span>${esc(u)}</div>`).join("");
}

// ── send ─────────────────────────────────────────────────────────────────────
function send(){
  const i=document.getElementById("mi"); const v=i.value.trim();
  if(!v||!ws||ws.readyState!==1) return;
  ws.send(JSON.stringify({type:"chat",content:v}));
  i.value=""; i.focus();
}

// ── toasts ────────────────────────────────────────────────────────────────────
function toast(msg,sev="high"){
  const stack=document.getElementById("toasts");
  const d=document.createElement("div"); d.className=`toast ${sev}`;
  d.innerHTML=`<div class="t-hd"><span class="t-type">${sev==="critical"?"🚨 CRITICAL":"⚠ ALERT"}</span>
    <span class="t-time">${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span></div>
    <div class="t-msg">${esc(msg)}</div>`;
  stack.prepend(d); setTimeout(()=>d.remove(),5500);
}

function addRBAlert(txt,sev){
  const s=document.getElementById("rbalerts");
  const old=s.querySelector(".at"); if(old) old.remove();
  const d=document.createElement("div"); d.className=`a-item ${sev}`;
  d.innerHTML=`<span class="at">${new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"})}</span> ${esc(txt)}`;
  s.prepend(d); if(s.children.length>12) s.removeChild(s.lastChild);
}

// ── QR ─────────────────────────────────────────────────────────────────────────
function openQR() { document.getElementById("qr-wrap").classList.add("show"); }
function closeQR(){ document.getElementById("qr-wrap").classList.remove("show"); }
async function genQR(){
  const out=document.getElementById("qr-out");
  out.innerHTML=`<p style="font-family:var(--mono);font-size:.75rem;color:var(--cyan);padding:.8rem">Generating…</p>`;
  const r=await fetch(`/chat/qr/${ROOM}`); const d=await r.json();
  out.innerHTML=`<img src="${d.qr_image}">
    <div class="qr-meta">⏱ Expires in ${d.expires_in}s · single-use · device-bound</div>
    <a class="qr-link" href="${d.join_url}" target="_blank">${d.join_url}</a>
    <p class="qr-meta" style="margin-top:.5rem">📷 Point any phone camera at this code to join</p>`;
}

async function logout(){
  await fetch("/auth/logout",{method:"POST",headers:{"x-session-token":ST}});
  sessionStorage.clear(); location.href="/";
}

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// keepalive ping
setInterval(()=>{if(ws&&ws.readyState===1) ws.send(JSON.stringify({type:"ping"}))},20000);

connect();
</script>
